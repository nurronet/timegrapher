# Chapter 8, Charts and Distributions: the Charts pane alone, on the first
# 54 hours of a 64 h 51 min take of a Dandong 3235, fully wound and left
# dial up until it stopped, 59.8 h in (the last hours, as it died, would
# set the scales); the Amplitude and Beat Error charts turned on.
