# Chapter 11, Periods: the first 12 hours of a fully wound Dandong 3235,
# dial up, the pane alone with the readings hidden.
output = "steady-periods.png"

actions = [["sleep", 150]]

marks = []

layout = "SteadyPeriods"

[settings]
show_readings = false

[data]
corpus = "ym42_DU_65h"
files = ["take_part01-001.flac", "take_part01-002.flac", "take_part01-003.flac", "take_part01-004.flac", "take_part01-005.flac", "take_part01-006.flac", "take_part01-007.flac", "take_part01-008.flac", "take_part01-009.flac", "take_part01-010.flac", "take_part01-011.flac", "take_part01-012.flac"]

[data.session]
watch = "Dandong 3235"
calibre = "Dandong 3235"
bph = 28800
lift = 55
position = "DU"

[window]
size = [1800, 1000]

[wait]
at_most = 1200
