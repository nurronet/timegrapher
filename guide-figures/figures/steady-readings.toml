# Chapter 10, Readings Over Time: the first 12 hours of a fully wound Dandong 3235,
# dial up, the pane alone with the readings hidden.
output = "steady-readings.png"

actions = [["sleep", 150]]

# 1 a reading, 2 a stretch's level, 3 the change between two stretches,
# 4 the key, 5 time in the position.
marks = [[1, 1522, 330], [2, 1000, 687], [3, 266, 540], [4, 1605, 210], [5, 1045, 1000]]

layout = "SteadyReadings"

[settings]
show_readings = false

[data]
corpus = "ym42_DU_65h"
files = ["take_part01-001.flac", "take_part01-002.flac", "take_part01-003.flac", "take_part01-004.flac", "take_part01-005.flac", "take_part01-006.flac", "take_part01-007.flac", "take_part01-008.flac", "take_part01-009.flac", "take_part01-010.flac", "take_part01-011.flac", "take_part01-012.flac"]

[data.session]
watch = "Dandong 3235"
calibre = "Dandong 3235"
bph = 28800
lift = 55
position = "DU"

[window]
size = [1800, 1000]

[wait]
at_most = 1200
