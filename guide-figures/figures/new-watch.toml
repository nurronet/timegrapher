# Chapter 22: the New Watch form, a name typed.
output = "new-watch.png"

# 1 Name, 2 Calibre, 3 Lift Angle, 4 Beat Rate, 5 Notes, 6 Add Field,
# 7 Add Watch.
marks = [[1, 1200, 448], [2, 1200, 478], [3, 1200, 508], [4, 1200, 538], [5, 1200, 603],
         [6, 835, 647], [7, 1200, 716]]

layout = ["column", [0.615, "Strip"], [0.385, ["tabs", "Sound", "Scope"]]]

actions = [["sleep", 3], ["click", 343, 19], ["sleep", 2], ["click", 76, 65], ["sleep", 2],
           ["click", 949, 381], ["type", "Bare ETA 2824-2"], ["sleep", 1],
           ["click", 949, 411], ["sleep", 1], ["type", "ETA 2824-2"], ["sleep", 1],
           ["key", "Return"], ["sleep", 2]]

