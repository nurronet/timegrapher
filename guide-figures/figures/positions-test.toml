output = "positions-test.png"

actions = [["sleep", 5], ["click", 395, 105], ["sleep", 1], ["type", "Dandong 3235"], ["sleep", 1], ["key", "Return"], ["sleep", 1], ["stand", "DU"], ["click", 65, 469], ["sleep", 1], ["click", 571, 107], ["sleep", 32], ["stand", "DD"], ["sleep", 1], ["click", 1497, 525], ["sleep", 32], ["stand", "CD"], ["sleep", 1], ["click", 1497, 525], ["sleep", 32], ["stand", "CL"], ["sleep", 1], ["click", 1497, 525], ["sleep", 32], ["stand", "CU"], ["sleep", 1], ["click", 1497, 525], ["sleep", 32], ["stand", "CR"], ["sleep", 1], ["click", 1497, 525], ["sleep", 14]]

marks = [[1, 200, 520], [2, 330, 520], [3, 430, 520], [4, 490, 520], [5, 300, 592], [6, 1450, 592],
