         [5, 1145, 532], [6, 1145, 640], [7, 1395, 201]]

layout = ["column", [0.615, "Strip"], [0.385, ["tabs", "Sound", "Scope"]]]

actions = [["sleep", 5], ["stand", "DU"], ["click", 571, 107], ["sleep", 12],
           ["click", 1044, 19], ["sleep", 2], ["click", 424, 218], ["sleep", 2]]

