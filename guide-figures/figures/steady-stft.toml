# Chapter 17, STFT Map: the first 12 hours of a fully wound Dandong 3235,
# dial up, the pane alone with the readings hidden, on the dB scale, the
# pointer on the escape wheel's line.
output = "steady-stft.png"

actions = [["sleep", 150], ["click", 133, 90], ["sleep", 3], ["hover", 751, 690], ["sleep", 2]]

# 1 the series control, left of the pane; 2 dB Scale, 3 Wheel Periods,
# above them; 4 a line across, 5 a bright patch, 6 the key, 7 a wheel's
# name, 8 the pointer on a wheel's line.
marks = [[1, 28, 157], [2, 182, 129], [3, 216, 129], [4, 1000, 735], [5, 1110, 240],
         [6, 590, 1009], [7, 1796, 780], [8, 950, 785]]

layout = "SteadyStft"

[settings]
show_readings = false

[data]
corpus = "ym42_DU_65h"
files = ["take_part01-001.flac", "take_part01-002.flac", "take_part01-003.flac", "take_part01-004.flac", "take_part01-005.flac", "take_part01-006.flac", "take_part01-007.flac", "take_part01-008.flac", "take_part01-009.flac", "take_part01-010.flac", "take_part01-011.flac", "take_part01-012.flac"]

[data.session]
watch = "Dandong 3235"
calibre = "Dandong 3235"
bph = 28800
lift = 55
position = "DU"

[window]
size = [1800, 1000]

[wait]
at_most = 1200
