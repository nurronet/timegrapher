# Chapter 22: the Watches view, a watch picked, its takes read.
output = "watches-view.png"

# 1 New Watch…, 2 search, 3 Sort, 4 List Shows, 5 Unsorted Takes, 6 a
# watch's row, picked, 7 the watch's header, 8 Edit…, 9 Add Photos…,
# 10 New Take, 11 Takes with Open and …, 12 a take, picked, 13 the
# columns, 14 Details, 15 Photos.
marks = [[1, 125, 108], [2, 285, 108], [3, 440, 108], [4, 605, 108], [5, 247, 164],
         [6, 230, 260], [7, 1000, 170], [8, 1303, 200], [9, 1405, 200], [10, 460, 214],
         [11, 1250, 321], [12, 650, 504], [13, 700, 372], [14, 440, 547], [15, 440, 695]]

layout = ["column", [0.615, "Strip"], [0.385, ["tabs", "Sound", "Scope"]]]

actions = [["sleep", 3], ["click", 343, 19], ["sleep", 3], ["click", 79, 193], ["sleep", 40], ["click", 391, 437], ["sleep", 2]]

[wait]
at_least = 20
at_most = 400

[window]
size = [1800, 1000]

[[watch]]
