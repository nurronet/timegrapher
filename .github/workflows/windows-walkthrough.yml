name: Windows walkthrough

# A Windows desktop an agent drives live, for walkthroughs of the desktop app
# (.github/walkthrough/README.md). Started by hand; not part of CI.
#
# It builds the app at `ref` (and at `base_ref` when given), sets the display
# to 1920 x 1080, opens the head build, then for `minutes` serves step files
# pushed to walk/cmd/ on the `channel` branch, answering each with a
# screenshot in walk/out/ on that branch.
#
# `ref` and `base_ref` must be branch names of this repository. They are
# built in a job with read-only permission and handed to the walk job as an
# artifact, so no code from them runs before the step loop holds the write
# token. The app under test does run on the same machine as the loop while
# it walks: the loop starts it without the token and runs git without hooks.
on:
  # TEMPORARY for the proving run; removed before review.
  push:
    branches: [claude/project-thread-00w04j]
    paths: ['.github/walkthrough/*.p*', '.github/workflows/windows-walkthrough.yml']
  workflow_dispatch:
    inputs:
      ref:
        description: Branch of this repository to walk (the PR head)
        required: true
      base_ref:
        description: Optional branch of this repository to compare against (the PR base)
        required: false
        default: ''
      channel:
        description: Branch the agent pushes steps to and reads answers from
        required: true
      minutes:
        description: How long the session serves steps
        required: false
        default: '120'

permissions:
  contents: read

concurrency:
  group: windows-walkthrough-${{ inputs.channel || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    steps:
      - name: Only branches of this repository
        shell: bash
        env:
          HEAD_REF: ${{ inputs.ref || github.ref_name }}
          BASE_REF: ${{ inputs.base_ref || (github.event_name == 'push' && 'main' || '') }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          for r in "$HEAD_REF" "$BASE_REF"; do
            [ -z "$r" ] && continue
            if ! git ls-remote --exit-code --heads "$REPO_URL" "refs/heads/$r" >/dev/null; then
              echo "::error::$r is not a branch of this repository"; exit 1
            fi
          done
      - name: Head source
        uses: actions/checkout@v7
        with:
          ref: refs/heads/${{ inputs.ref || github.ref_name }}
          path: head
          persist-credentials: false
      - name: Base source
        if: inputs.base_ref != '' || github.event_name == 'push'
        uses: actions/checkout@v7
        with:
          ref: refs/heads/${{ inputs.base_ref || 'main' }}
          path: base
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-walkthrough
          save-if: false
          workspaces: |
            head
            base
      - name: Build head
        working-directory: head
        run: cargo build --release -p timegrapher-app
      - name: Build base
        if: inputs.base_ref != '' || github.event_name == 'push'
        working-directory: base
        run: cargo build --release -p timegrapher-app
      - name: Collect the builds
        shell: bash
        run: |
          mkdir -p apps
          cp head/target/release/timegrapher-app.exe apps/head.exe
          [ -f base/target/release/timegrapher-app.exe ] && cp base/target/release/timegrapher-app.exe apps/base.exe
          ls -la apps
      - uses: actions/upload-artifact@v4
        with:
          name: walk-apps
          path: apps/
          retention-days: 1

  walk:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - name: Tool scripts
        uses: actions/checkout@v7
        with:
          path: tool
          persist-credentials: false
          sparse-checkout: .github/walkthrough
      - name: Builds
        uses: actions/download-artifact@v4
        with:
          name: walk-apps
          path: apps
      - name: Channel branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.channel || github.ref_name }}
          path: channel
          persist-credentials: false
      - name: Display 1920 x 1080
        shell: pwsh
        run: ./tool/.github/walkthrough/display.ps1
      - name: Driver
        run: python -m pip install --quiet pyautogui==0.9.54 pillow==11.0.0
      - name: Serve steps
        shell: bash
        env:
          WALK_CHANNEL: ${{ inputs.channel || github.ref_name }}
          WALK_MINUTES: ${{ inputs.minutes || '20' }}
          WALK_TOKEN: ${{ github.token }}
        run: |
          base=""
          [ -f apps/base.exe ] && base=apps/base.exe
          python tool/.github/walkthrough/driver.py channel apps/head.exe $base
      - name: App logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walk-logs
          path: walk-logs/
          if-no-files-found: ignore
