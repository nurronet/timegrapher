name: Wesley Windows probe (not for merge)

# Feasibility probe from the Wesley thread: can a GitHub windows-latest
# runner run the desktop app and let an agent drive it (screenshots, keys,
# clicks)? Runs only on this branch. Commands arrive as commits to
# .github/wesley/cmd/ and results go back to .github/wesley/out/.
on:
  push:
    branches: [claude/project-thread-00w04j]
    paths-ignore: ['.github/wesley/cmd/**', '.github/wesley/out/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: wesley-probe
      - name: Build app
        run: cargo build --release -p timegrapher-app
      - name: Desktop facts
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::PrimaryScreen | Format-List
          query user 2>&1
          Get-CimInstance Win32_VideoController | Select Name,DriverVersion,CurrentHorizontalResolution,CurrentVerticalResolution | Format-List
          Get-CimInstance Win32_SoundDevice | Select Name,Status | Format-List
      - name: Python driver deps
        run: python -m pip install --quiet pyautogui pillow
      - name: Drive the app
        shell: bash
        run: python .github/wesley/driver.py target/release/timegrapher-app.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wesley-probe-shots
          path: wesley-shots/
